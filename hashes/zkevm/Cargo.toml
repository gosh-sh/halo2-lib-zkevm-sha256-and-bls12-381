[package]
name = "zkevm-hashes"
version = "0.2.1"
authors = ["Privacy Scaling Explorations Team", "Taiko Labs", "Intrinsic Technologies"]
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://github.com/axiom-crypto/halo2-lib"
readme = "README.md"
description = "Library of ZK gadgets for hash functions in halo2. This is Axiom's modification of the circuits in the zkEVM project."
rust-version = "1.73.0"

[dependencies]
array-init = "2.0.0"
ethers-core = "2.0.8"
rand = "0.8"
itertools = "0.11"
lazy_static = "1.4"
log = "0.4"
num-bigint = { version = "0.4" }
halo2-base = { version = "=0.4.1", path = "../../halo2-base", default-features = false, features = ["test-utils"] }
serde = { version = "1.0", features = ["derive"] }
rayon = "1.8"
# gosh fork: SHA-256 chip dependency.
sha2 = "0.10.7"
sha3 = "0.10.8"
# always included but without features to use Native poseidon and get CircuitExt trait
# Pinned to 164bd42e (branch stable-rust-on-ccdb510), matching the rev
# now pinned in gosh-sh/axiom-eth on `gosh-stable-rlcmanager-assignment`.
# 164bd42e == ccdb510 + mechanical PR-#72 backport for stable Rust: trait
# aliases become regular traits with blanket GWC/SHPLONK impls, and the
# `AggregationCircuit` associated-type default is dropped. Crucially this
# rev does NOT take PR #71's rename — `Halo2KzgAccumulationScheme` is kept,
# so axiom-eth (which references the old name) and zkevm-hashes still share
# one snark-verifier-sdk copy in the graph.
# snark-verifier-sdk = { version = "=0.1.7", default-features = false }
snark-verifier-sdk = { git = "https://github.com/gosh-sh/snark-verifier", rev = "164bd42e300b382239e63b16532faca539d6b324", default-features = false }
getset = "0.1.2"
type-map = "0.5.0"

[dev-dependencies]
ethers-signers = "2.0.8"
hex = "0.4.3"
itertools = "0.11"
pretty_assertions = "1.0.0"
rand_core = "0.6.4"
rand_xorshift = "0.3"
env_logger = "0.10"
test-case = "3.1.0"

[features]
default = ["halo2-axiom", "display"]
display = ["snark-verifier-sdk/display"]
halo2-pse = ["halo2-base/halo2-pse", "snark-verifier-sdk/halo2-pse"]
halo2-axiom = ["halo2-base/halo2-axiom", "snark-verifier-sdk/halo2-axiom"]
jemallocator = ["halo2-base/jemallocator"]
mimalloc = ["halo2-base/mimalloc"]
asm = ["halo2-base/asm"]
